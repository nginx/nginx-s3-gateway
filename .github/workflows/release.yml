---
name: Release Drafter
on:
  push:
    branches: [main]
  # pull_request_target is required for the autolabeler to support PRs from
  # forks. `edited` keeps labels in sync when authors fix their titles after
  # a lint-pr-title failure. Restricted to PRs targeting main so events from
  # other base branches cannot touch the release draft.
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches: [main]

permissions: read-all

# Serialize runs: parallel drafter runs race on find-or-create of the draft
# release and can create duplicate drafts.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  update_release_draft:
    permissions:
      # write permission is required to create a github release
      contents: write
      # write permission is required for autolabeler
      # otherwise, read permission is required at least
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Run Release Drafter
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          # Only pushes to main update the release draft; PR events run just
          # the autolabeler. Without this the drafter runs on every event and
          # regenerates the draft from the PR's base branch.
          disable-releaser: ${{ github.event_name != 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
