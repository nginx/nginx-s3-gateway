; checkmake configuration -- https://github.com/mrtazz/checkmake
;
; Run with: checkmake --config .checkmake.ini GNUmakefile
;
; The default maxBodyLength of 5 is too aggressive for an orchestration
; Makefile that wraps docker builds, test-matrix sequencing, and tool
; availability checks. 80 matches the convention used in sibling F5 repos
; while still flagging genuinely runaway recipes that should be split
; into helper scripts.

[maxbodylength]
maxBodyLength = 80
