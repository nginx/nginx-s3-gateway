services:
  nginx-s3-gateway:
    depends_on:
      ecs-credentials:
        condition: service_healthy
    networks:
      - default
      - metadata
    environment:
      AWS_ACCESS_KEY_ID: null
      AWS_SECRET_ACCESS_KEY: null
      AWS_SESSION_TOKEN: null
      AWS_CONTAINER_CREDENTIALS_RELATIVE_URI: /credentials

  ecs-credentials:
    profiles: ["dynamic-credentials"]
    # Keep the metadata mock root-capable even when the gateway under test is
    # the unprivileged variant: the ECS endpoint is fixed at port 80.
    image: "nginx:1.31.3@sha256:8541484afbc9c8a5a8a99b379568ebbc957f658583ec9448fc43104229c03cf8"
    entrypoint: ["/usr/sbin/nginx", "-c", "/etc/nginx/ecs_credentials_mock.conf", "-g", "daemon off;"]
    volumes:
      - "./integration/ecs_credentials_mock.conf:/etc/nginx/ecs_credentials_mock.conf:ro"
    networks:
      metadata:
        ipv4_address: 169.254.170.2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 3

networks:
  metadata:
    ipam:
      config:
        - subnet: 169.254.170.0/24
