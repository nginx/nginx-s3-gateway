# Overlay that supplies the gateway's static credentials through mounted
# secret files instead of environment variables (GH-67). Used by
# integration_test_secret_file_credentials in run_integration_tests.sh.
#
# The nulls only mean "inherit from the shell" to compose, not "unset", so the
# runner also has to scrub the variables from its own environment before
# invoking compose - the same trap documented for the dynamic-credentials
# overlay.
services:
  nginx-s3-gateway:
    environment:
      AWS_ACCESS_KEY_ID: null
      AWS_SECRET_ACCESS_KEY: null
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/aws_access_key_id
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/aws_secret_access_key
    secrets:
      - aws_access_key_id
      - aws_secret_access_key

secrets:
  aws_access_key_id:
    file: "${TEST_SECRETS_DIR:-/tmp/nginx-s3-gateway-test-secrets}/aws_access_key_id"
  aws_secret_access_key:
    file: "${TEST_SECRETS_DIR:-/tmp/nginx-s3-gateway-test-secrets}/aws_secret_access_key"
