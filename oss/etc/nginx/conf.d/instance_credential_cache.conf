# OSS caches temporary AWS credentials in shared memory so they are available
# across worker processes without writing secrets to the container filesystem.
#
# No timeout: a zone timeout would evict the single cache entry at a fixed
# instant, opening a window where a request passes the auth_request
# credential check and then reads an empty cache when the proxy headers are
# built. Credential freshness is enforced by the expiration field that
# fetchCredentials() checks on every request, so time-based eviction adds
# nothing but that race. The zone holds one small JSON entry; 64k leaves
# ample slab headroom for large federated STS session tokens.
js_shared_dict_zone zone=instance_credential_cache:64k;
